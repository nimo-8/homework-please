<script>
'use strict';
// ============================================================
//  IP CHECKPOINT —— 复刻练习版
//  玩法致敬《IP, PLEASE》（ip-please.github.io）与《Papers, Please》
//  全部代码、图形、音效为本文件内从零实现：无外部资源。
// ============================================================

// ══════════════ 0. 工具 ══════════════
const W = 640, H = 360;
const clampU = (u) => Math.max(0, Math.min(1, u));
const seg = (t, a, b) => (b > a ? clampU((t - a) / (b - a)) : +(t >= b));
const easeOut = (u) => 1 - (1 - u) ** 3;
const lerp = (a, b, u) => a + (b - a) * u;
const inBox = (x, y, b) => x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = rint(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const digits = (n) => Array.from({ length: n }, () => rint(0, 9)).join('');
const pad2 = (n) => String(n).padStart(2, '0');
const randDate = (y0, y1) => `${rint(y0, y1)}.${pad2(rint(1, 12))}.${pad2(rint(1, 28))}`;
const todayStr = () => '2026.10.' + pad2(18 + S.day);

// ══════════════ 1. 调色板与图元 ══════════════
const C = {
  INK: [22, 19, 19], OUTLINE: [34, 27, 25], GROUND: [93, 87, 78], GROUND_D: [70, 64, 58],
  WALL: [46, 42, 39], COUNTER: [98, 86, 73], DESK: [68, 57, 50], DESK_D: [52, 44, 39], DESK_L: [86, 73, 63],
  PAPER: [226, 215, 196], PAPER_D: [200, 187, 167], PAPER_LINE: [216, 204, 184],
  PINK: [224, 198, 186], PINK_D: [196, 166, 156], SAGE: [208, 214, 190], SAGE_D: [172, 180, 152],
  TEXT: [74, 56, 48], TEXT_L: [128, 106, 92], NAVY: [42, 50, 76], NAVY_L: [60, 70, 100],
  RED: [180, 46, 40], RED_D: [120, 30, 28], GREEN: [84, 128, 70], GREEN_D: [56, 88, 48],
  WHITE: [228, 223, 212], GREY: [150, 145, 136], GREY_D: [100, 94, 88], ORANGE: [220, 150, 70],
  CLAUDE: [204, 112, 80], CLAUDE_L: [232, 156, 116], GOLD: [190, 160, 100], BOOK: [92, 64, 50], BOOK_L: [130, 100, 70],
  SKIN: [198, 152, 120], XRAY_BG: [18, 40, 42],
};
const K = {};
for (const k in C) K[k] = `rgb(${C[k][0]},${C[k][1]},${C[k][2]})`;
const rgb3 = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

let G = null;
function setCtx(ctx) { G = ctx; G.imageSmoothingEnabled = false; }
function makeCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h);
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}
function rect(x0, y0, x1, y1, col) { G.fillStyle = col; G.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1); }
function outline(x0, y0, x1, y1, col, w = 1) {
  rect(x0, y0, x1, y0 + w - 1, col); rect(x0, y1 - w + 1, x1, y1, col);
  rect(x0, y0, x0 + w - 1, y1, col); rect(x1 - w + 1, y0, x1, y1, col);
}
function pt(x, y, col) { G.fillStyle = col; G.fillRect(x, y, 1, 1); }
function line(x0, y0, x1, y1, col) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  if (y0 === y1) return rect(Math.min(x0, x1), y0, Math.max(x0, x1), y0, col);
  if (x0 === x1) return rect(x0, Math.min(y0, y1), x0, Math.max(y0, y1), col);
  G.fillStyle = col;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    G.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function darken(a, col = K.INK, box = null) {
  G.fillStyle = col === K.INK ? `rgba(22,19,19,${a})` : col;
  if (box) G.fillRect(box[0], box[1], box[2] - box[0], box[3] - box[1]); else G.fillRect(0, 0, W, H);
}
const CURSOR_PX = ['X.........','XX........','XWX.......','XWWX......','XWWWX.....','XWWWWX....','XWWWWWX...','XWWWWWWX..','XWWWWWWWX.','XWWWWXXXXX','XWWXWX....','XWX.XWX...','XX...XWX..','......XX..'];
const HAND_PX = ['....XX......','...XWWX.....','...XWWX.....','...XWWXXX...','...XWWXWWXX.','.XXXWWXWWXWX','XWWXWWWWWXWX','XWWWWWWWWWWX','.XWWWWWWWWWX','..XWWWWWWWX.','...XWWWWWX..','...XXXXXXX..'];
function drawCursorPx(pat, x, y) {
  for (let j = 0; j < pat.length; j++) for (let i = 0; i < pat[j].length; i++) {
    const c = pat[j][i];
    if (c === 'X') { G.fillStyle = K.INK; G.fillRect(x + i, y + j, 1, 1); }
    else if (c === 'W') { G.fillStyle = K.WHITE; G.fillRect(x + i, y + j, 1, 1); }
  }
}

// ══════════════ 2. 像素字管线：4 倍绘制 → 最近邻降采样 ══════════════
const PXK = 6;
const [MEAS, MG] = makeCanvas(8, 8);
const FONT_STACK = '"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
const wCache = new Map(), tCache = new Map();
function chW(ch, size) {
  const key = size + '|' + ch;
  let w = wCache.get(key);
  if (w !== undefined) return w;
  MG.font = `bold ${size * PXK}px ${FONT_STACK}`;
  w = Math.max(1, Math.round(MG.measureText(ch).width / PXK));
  if (wCache.size > 4000) wCache.clear();
  wCache.set(key, w);
  return w;
}
function tw(s, size = 12) { let w = 0; for (const ch of String(s)) w += chW(ch, size); return w; }
function textCanvas(s, size, col) {
  const key = size + '|' + col + '|' + s;
  let c = tCache.get(key);
  if (c) return c;
  if (tCache.size > 1200) tCache.clear();
  const w = tw(s, size) + 4, h = size + 6;
  const [cv, g] = makeCanvas(w * PXK, h * PXK);
  g.font = `bold ${size * PXK}px ${FONT_STACK}`;
  g.textBaseline = 'top';
  g.fillStyle = '#000';
  let x = 2 * PXK;
  for (const ch of s) { g.fillText(ch, x, PXK); x += chW(ch, size) * PXK; }
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = col;
  g.fillRect(0, 0, cv.width, cv.height);
  const [out, og] = makeCanvas(w, h);
  og.imageSmoothingEnabled = true; og.imageSmoothingQuality = 'high';
  og.drawImage(cv, 0, 0, w, h);
  tCache.set(key, out);
  return out;
}
function txt(x, y, s, size = 12, col = K.WHITE, anchor = 'la') {
  s = String(s);
  if (!s) return;
  const c = textCanvas(s, size, col);
  const w = tw(s, size);
  if (anchor === 'ma') x = Math.round(x - w / 2);
  else if (anchor === 'ra') x -= w;
  G.drawImage(c, x - 2, y - 1);
}
function wrap(s, size, width) {
  const lines = []; let cur = '';
  for (const ch of s) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (cur && tw(cur + ch, size) > width) { lines.push(cur); cur = ch.trim(); } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ══════════════ 3. 音效（WebAudio 全合成） ══════════════
const SFX = {
  ac: null, muted: false, hum: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  },
  t() { return this.ac.currentTime; },
  env(g0, t0, a, d, peak = 1) {
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak * g0, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    g.connect(this.ac.destination);
    return g;
  },
  osc(type, f0, f1, t0, dur) {
    const o = this.ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.05);
    return o;
  },
  noise(t0, dur) {
    const n = this.ac.createBufferSource();
    const buf = this.ac.createBuffer(1, Math.ceil(this.ac.sampleRate * dur), this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = buf; n.start(t0);
    return n;
  },
  play(name, vol = 1) {
    this.init();
    if (!this.ac || this.muted) return;
    const t0 = this.t(), A = this.ac;
    if (name === 'click') { this.osc('square', 900, 700, t0, 0.04).connect(this.env(0.12 * vol, t0, 0.004, 0.05)); }
    else if (name === 'select') { this.osc('square', 660, 880, t0, 0.06).connect(this.env(0.1 * vol, t0, 0.004, 0.07)); }
    else if (name === 'paper') {
      const n = this.noise(t0, 0.14), f = A.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 2400 + Math.random() * 800; f.Q.value = 0.8;
      n.connect(f); f.connect(this.env(0.16 * vol, t0, 0.005, 0.13));
    } else if (name === 'thud') { this.osc('sine', 150, 55, t0, 0.12).connect(this.env(0.5 * vol, t0, 0.003, 0.14)); }
    else if (name === 'stamp_ok') {
      this.osc('sine', 160, 50, t0, 0.1).connect(this.env(0.5 * vol, t0, 0.002, 0.12));
      this.osc('square', 1200, 1200, t0 + 0.02, 0.05).connect(this.env(0.06 * vol, t0 + 0.02, 0.002, 0.06));
    } else if (name === 'stamp_no') {
      this.osc('square', 130, 90, t0, 0.22).connect(this.env(0.3 * vol, t0, 0.004, 0.24));
      this.osc('sawtooth', 65, 60, t0, 0.22).connect(this.env(0.2 * vol, t0, 0.004, 0.24));
    } else if (name === 'discrepancy') {
      this.osc('square', 880, 880, t0, 0.09).connect(this.env(0.14 * vol, t0, 0.004, 0.1));
      this.osc('square', 660, 660, t0 + 0.11, 0.12).connect(this.env(0.14 * vol, t0 + 0.11, 0.004, 0.13));
    } else if (name === 'intercom') {
      this.osc('sine', 820, 820, t0, 0.1).connect(this.env(0.1 * vol, t0, 0.01, 0.12));
      this.osc('sine', 820, 820, t0 + 0.16, 0.1).connect(this.env(0.1 * vol, t0 + 0.16, 0.01, 0.12));
    } else if (name === 'step') {
      const n = this.noise(t0, 0.05), f = A.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 300;
      n.connect(f); f.connect(this.env(0.22 * vol, t0, 0.002, 0.06));
    } else if (name === 'day_hit') {
      this.osc('sine', 220, 45, t0, 0.3).connect(this.env(0.6 * vol, t0, 0.003, 0.32));
      this.noise(t0, 0.06).connect(this.env(0.1 * vol, t0, 0.002, 0.06));
    } else if (name === 'whoosh') {
      const n = this.noise(t0, 0.3), f = A.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.setValueAtTime(400, t0);
      f.frequency.exponentialRampToValueAtTime(3600, t0 + 0.28); f.Q.value = 1.2;
      n.connect(f); f.connect(this.env(0.14 * vol, t0, 0.05, 0.26));
    } else if (name === 'coin') {
      this.osc('square', 990, 990, t0, 0.07).connect(this.env(0.09 * vol, t0, 0.003, 0.08));
      this.osc('square', 1320, 1320, t0 + 0.08, 0.12).connect(this.env(0.09 * vol, t0 + 0.08, 0.003, 0.13));
    } else if (name === 'sad') {
      [392, 330, 262].forEach((f0, i) => this.osc('triangle', f0, f0, t0 + i * 0.16, 0.22).connect(this.env(0.12 * vol, t0 + i * 0.16, 0.01, 0.24)));
    } else if (name === 'slip') {
      this.osc('square', 500, 1500, t0, 0.12).connect(this.env(0.1 * vol, t0, 0.004, 0.14));
    }
  },
  mumble(text, pitch, seed) {
    this.init();
    if (!this.ac || this.muted) return;
    const t0 = this.t(), n = Math.min(10, Math.max(3, Math.floor([...text].length / 2.4)));
    for (let i = 0; i < n; i++) {
      const f = pitch * (1 + 0.22 * Math.sin(seed * 3.7 + i * 2.9));
      this.osc('square', f, f * 0.92, t0 + i * 0.055, 0.045).connect(this.env(0.05, t0 + i * 0.055, 0.004, 0.05));
    }
  },
  ambient(on) {
    this.init();
    if (!this.ac) return;
    if (on && !this.hum && !this.muted) {
      const o = this.ac.createOscillator(), g = this.ac.createGain(), f = this.ac.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = 52;
      f.type = 'lowpass'; f.frequency.value = 140;
      g.gain.value = 0.018;
      o.connect(f); f.connect(g); g.connect(this.ac.destination); o.start();
      this.hum = { o, g };
    } else if (!on && this.hum) { try { this.hum.o.stop(); } catch (e) {} this.hum = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) this.ambient(false);
    else if (scene === 'booth') this.ambient(true);
    return this.muted;
  },
};

// ══════════════ 4. 证件与作业 ══════════════
function docShadow(x, y, w, h) { rect(x + 2, y + 2, x + w + 1, y + h + 1, K.DESK_D); }

class Passport {
  constructor({ country, name, rows, cover = C.NAVY, band = C.NAVY_L, crayon = false, expired = false }) {
    Object.assign(this, { country, name, rows, crayon });
    this.cover = rgb3(cover); this.band = rgb3(band);
    this.w = 176; this.h = 118;
    this.icon = ['book', cover];
    this.fields = { header: [3, 3, 172, 16], name: [56, 20, 172, 34], photo: [9, 22, 50, 73] };
    rows.forEach(([k], i) => { this.fields[k] = [56, 40 + i * 12, 160, 51 + i * 12]; });
    if (expired) this.exp = rows.find((r) => r[0] === 'EXP');
  }
  draw(x, y) {
    const { w, h } = this;
    docShadow(x, y, w, h);
    rect(x, y, x + w - 1, y + h - 1, this.cover);
    rect(x + 3, y + 3, x + w - 4, y + h - 4, K.PAPER);
    for (let yy = y + 22; yy < y + h - 20; yy += 4) rect(x + 56, yy, x + w - 8, yy, K.PAPER_LINE);
    rect(x + 3, y + 3, x + w - 4, y + 16, this.band);
    txt(x + w / 2, y + 5, this.country, 8, K.PAPER, 'ma');
    rect(x + 9, y + 22, x + 50, y + 73, K.PAPER_D);
    drawPhoto(x + 10, y + 23, this.photoSeed || 0);
    // 粗糙的小国徽：盾 + 星
    outline(x + 20, y + 80, x + 38, y + 100, K.GOLD);
    line(x + 29, y + 84, x + 29, y + 96, K.GOLD);
    line(x + 24, y + 88, x + 34, y + 88, K.GOLD);
    txt(x + 58, y + 21, this.name, tw(this.name, 12) > 112 ? 10 : 12, K.TEXT);
    this.rows.forEach(([k, v], i) => {
      txt(x + 58, y + 41 + i * 12, k, 8, K.TEXT_L);
      txt(x + 84, y + 40 + i * 12, v, tw(v, 10) > 92 ? 8 : 10, K.TEXT);
    });
  }
}

// 程序生成证件照：种子 → 脸型/发色/发型
function drawPhoto(x, y, seed, crayon = false) {
  const r = (n) => { seed = (seed * 9301 + 49297) % 233280; return (seed / 233280) * n; };
  const skins = ['rgb(198,152,120)', 'rgb(168,120,92)', 'rgb(222,180,150)', 'rgb(140,96,70)'];
  const hairs = ['rgb(40,32,28)', 'rgb(90,60,36)', 'rgb(150,110,60)', 'rgb(70,70,74)'];
  const skin = skins[Math.floor(r(skins.length))], hair = hairs[Math.floor(r(hairs.length))];
  const bg = crayon ? 'rgb(210,200,170)' : 'rgb(180,170,150)';
  rect(x, y, x + 39, y + 49, bg);
  rect(x + 12, y + 34, x + 27, y + 49, crayon ? 'rgb(80,90,170)' : 'rgb(60,60,70)'); // 肩
  rect(x + 14, y + 8, x + 25, y + 36, skin); // 脸
  const hs = Math.floor(r(3));
  if (hs === 0) rect(x + 13, y + 4, x + 26, y + 12, hair);
  else if (hs === 1) { rect(x + 13, y + 5, x + 26, y + 10, hair); rect(x + 12, y + 8, x + 14, y + 20, hair); rect(x + 25, y + 8, x + 27, y + 20, hair); }
  else rect(x + 13, y + 6, x + 26, y + 11, hair);
  const ey = y + 18 + Math.floor(r(3));
  pt(x + 17, ey, '#222'); pt(x + 22, ey, '#222');
  const my = y + 27;
  if (r(1) > 0.5) rect(x + 18, my, x + 21, my, '#5a3a30');
  else pt(x + 19, my, '#5a3a30');
  if (crayon) { // 蜡笔风：涂出界
    G.fillStyle = 'rgba(120,140,220,.5)'; G.fillRect(x + 2, y + 2, 3, 44); G.fillRect(x + 34, y + 8, 3, 30);
  }
}

class Card {
  constructor(rows, { title = '作业本', sub = 'HOMEWORK', color = C.PINK, colorD = C.PINK_D, valueX = 40, seal = true, printed = false, forged = false, ex = null } = {}) {
    this.rows = rows; this.title = title; this.sub = sub; this.printed = printed; this.forged = forged;
    this.ex = ex; this.marks = (ex || []).map(() => null); this.flipEx = false;
    this.color = rgb3(color); this.colorD = rgb3(colorD); this.valueX = valueX;
    this.seal = seal;
    this.w = 152;
    this.h = 20 + 14 * rows.length + (this.seal ? 16 : 6);
    this.icon = ['card', color];
    this.fields = {};
    rows.forEach(([k], i) => { this.fields[k] = [4, 18 + 14 * i, this.w - 5, 31 + 14 * i]; });
  }
  drawEx(x, y) {
    const { w, h } = this;
    rect(x, y, x + w - 1, y + h - 1, this.colorD);
    rect(x + 1, y + 1, x + w - 2, y + h - 2, 'rgb(240,236,222)');
    txt(x + 6, y + 5, '数学作业 · P32', 10, K.TEXT);
    txt(x + w - 6, y + 6, '封面 ◀', 8, K.TEXT_L, 'ra');
    rect(x + 6, y + 17, x + w - 7, y + 17, K.PAPER_D);
    this.ex.forEach((e, i) => {
      const yy = y + 24 + i * 20;
      txt(x + 10, yy, (i + 1) + ') ' + e.q.replace(' = ?', '') + ' = ' + e.a, 10, K.TEXT);
      const mx = x + w - 26, my = yy - 2;
      outline(mx, my, mx + 15, my + 14, K.GREY_D);
      const m = this.marks[i];
      if (m === true) { line(mx + 3, my + 7, mx + 6, my + 11, K.GREEN); line(mx + 6, my + 11, mx + 12, my + 3, K.GREEN); }
      else if (m === false) { line(mx + 3, my + 3, mx + 12, my + 12, K.RED); line(mx + 12, my + 3, mx + 3, my + 12, K.RED); }
    });

class Rulebook {
  constructor(day) {
    this.day = day; this.w = 200;
    const rules = RULES.filter((r) => r.day <= day);
    this.npages = day >= 5 ? 3 : (day >= 3 ? 2 : 1);
    this.pages = [];
    for (let p = 0; p < this.npages; p++) {
      const L = [];
      for (const r of rules.filter((q) => q.page === p)) {
        L.push({ s: r.head, size: 10, col: r.day === day ? K.RED_D : K.TEXT, key: r.key, isNew: r.day === day });
        for (const s of r.subs) L.push({ s, size: 8, col: K.TEXT_L, key: r.key });
      }
      if (p === this.npages - 1) L.push({ s: '§12 只看作业，不看脸', size: 8, col: K.TEXT_L, key: null });
      let y = 22;
      const fields = {};
      for (const row of L) {
        row.y = y;
        y += row.size === 10 ? 14 : 10;
        if (row.key) {
          const f = fields[row.key];
          fields[row.key] = f ? [f[0], f[1], f[2], y - 2] : [4, row.y - 2, this.w - 5, y - 2];
        }
      }
      this.pages.push({ rows: L, fields, h: y + 6 });
    }
    this.h = Math.max(...this.pages.map((p) => p.h));
    this.page = this.npages - 1;
    this.icon = ['book', C.BOOK];
  }
  get fields() { return this.pages[this.page].fields; }
  flip() { this.page = (this.page + 1) % this.npages; }
  draw(x, y) {
    const { w, h } = this;
    docShadow(x, y, w, h);
    rect(x, y, x + w - 1, y + h - 1, K.BOOK);
    rect(x + 3, y + 3, x + w - 4, y + h - 4, K.PAPER);
    rect(x + 3, y + 3, x + w - 4, y + 16, K.BOOK_L);
    txt(x + 8, y + 5, '班规 · 作业检查', 10, K.PAPER);
    if (this.npages > 1) {
      const tab = [this.w - 56, 3, this.w - 4, 16];
      rect(x + tab[0], y + tab[1], x + tab[2], y + tab[3], K.BOOK);
      txt(x + tab[2] - 4, y + 6, `第${this.page + 1}/${this.npages}页 ▶`, 8, K.PAPER, 'ra');
    } else txt(x + w - 8, y + 6, `DAY ${this.day}`, 8, K.PAPER, 'ra');
    for (const r of this.pages[this.page].rows) {
      if (r.s.includes('|') && r.s.indexOf('|') < 8) {
        const [a, b, c] = r.s.split('|');
        txt(x + 12, y + r.y, a, 8, r.col); txt(x + 52, y + r.y, b, 8, r.col); txt(x + 150, y + r.y, c, 8, r.col);
        continue;
      }
      txt(x + 8, y + r.y, r.s, r.size, r.col);
      if (r.isNew) {
        const nx = x + 10 + tw(r.s, r.size);
        rect(nx, y + r.y - 1, nx + 21, y + r.y + 8, K.RED);
        txt(nx + 3, y + r.y, 'NEW', 8, K.WHITE);
      }
    }
  }
}

function decisionOf(e) {

  B.total++; S.total++;

  else {

  if (hit && hit.d && hit.d.key === 'rule' && hit.d.big) {
    const d = hit.d, tabX = d.x + d.doc.w - 56;
    if (x >= tabX && y <= d.y + 16) { d.doc.flip(); SFX.play('paper', 0.7); I.sel = I.sel.filter((s) => s.d !== d); return; }
  }
  if (I.banner) { I.banner = null; I.sel = []; }
  if (!hit || !hit.key) return;
  if (hit.key === 'say') {
    I.sel = [hit];
    SFX.play('select');
    const tell = B.ent.spec.tell;
    if (tell && hit.ln.text === tell.say) { showIssue(tell); }
    else I.banner = { title: '这句话没什么问题', sub: '换一句听听，或者去查作业', bad: false };
    return;
  }
  if (I.sel.some((s) => s.key === 'say')) I.sel = [];
  const k = I.sel.findIndex((s) => s.key === hit.key);
  if (k >= 0) { I.sel.splice(k, 1); return; }
  I.sel.push(hit);
  SFX.play('select');
  if (I.sel.length === 1) {
    const single = matchIssue([hit.key]);
    if (single) { showIssue(single); return; }
  }
  if (I.sel.length < 2) return;
  const issue = matchIssue(I.sel.map((s) => s.key));
  if (issue) showIssue(issue);
  else I.banner = { title: '没有发现不符', sub: '这两项对得上（或者不相关）', bad: false };
}

// —— 抽背 ——
function quiz() {
  const e = B.ent;
  if (!e || e.phase !== 'here' || !e.suspect) { flashMsg('得先有疑点，才能抽背'); return; }
  const faker = e.tell || e.spec.ok.includes('detain');
  const q = pick(QUIZ);
  say('C', q[0]);
  later(1.6, () => {
    if (!B || B.ent !== e) return;
    if (faker) {
      e.slip = true; e.expr = 'nervous'; e.sweatT = e.sweatT === null ? now : e.sweatT;
      say('E', pick(QUIZ_CONFUSED));
      SFX.play('slip');

      say('E', q[1]);

  });
}

function toGame(ev) {

}
function onDown(ev) {

  ev.preventDefault();

}
function onMove(ev) {

}

function boothInput(x, y) {

  const tx = trayX();
  if (inBox(x, y, [tx - 14, 204, tx + 4, 244])) { B.tray.open = !B.tray.open; B.tray.t = now; SFX.play('paper', 0.5); return; }
  if (B.tray.open && now - B.tray.t > 0.4) {

  }

  if (inBox(x, y, INSPECT_BTN)) return setInspect(true);
  if (inBox(x, y, BOOK_BOX) && B.ruleInst) {
    if (!B.ruleInst.big) { B.ruleInst.big = true; B.ruleInst.x = 300; B.ruleInst.y = 232; B.ruleOpened = true; }
    else { B.ruleInst.big = false; B.ruleInst.x = 502; B.ruleInst.y = 316; }

  }

  if (S.day >= 2 && inBox(x, y, DETAIN_BTN)) return detain();
  if (S.day >= 2 && inBox(x, y, QUIZ_BTN)) return quiz();
  for (const d of [...B.docs].reverse()) {

function dragStart(d, x, y) {
  if (d.owner === 'cite') return;
  B.docs = B.docs.filter((o) => o !== d).concat([d]);
  drag = { d, startedBig: d.big, off: [x - d.x, y - d.y], prev: { big: d.big, x: d.x, y: d.y }, start: [x, y], moved: false };
  SFX.play('paper', 0.7);
}
function dragMove(x, y) {
  const d = drag.d;
  if (Math.hypot(x - drag.start[0], y - drag.start[1]) > 3) drag.moved = true;
  if (!drag.moved) return;
  if (x < DESK[0]) { d.big = false; d.x = x - 9; d.y = y - 6; return; }
  d.big = true;
  const g = drag.startedBig ? drag.off : [Math.min(30, d.doc.w / 2), 14];
  d.x = Math.max(DESK[0] - g[0], Math.min(W - 40, x - g[0]));

function dragEnd(x, y) {
  const d = drag.d, prev = drag.prev, moved = drag.moved;
  drag = null;
  if (!moved) {
    if (d.key === 'rule' && d.big) { d.doc.flip(); SFX.play('paper', 0.7); }
    else if (d.key === 'hw' && d.big && d.doc.ex) hwClick(d, x, y);

  }
  if (d.big) { SFX.play('paper', x); return; }
  if (d.key === 'rule') { d.big = false; d.x = 502; d.y = 316; SFX.play('paper'); return; }
  const e = B.ent;
  if (!e || (e.phase !== 'here')) { Object.assign(d, prev); return; }
  if (d.key === e.spec.primary && !decisionOf(e)) {
    Object.assign(d, prev);

    return;

}

  if (I.banner) {
    rect(...BANNER_BOX, 'rgba(22,19,19,0.88)');
    outline(...BANNER_BOX, I.banner.bad ? K.RED : K.GREY_D);
    txt(BANNER_BOX[0] + 8, BANNER_BOX[1] + 8, I.banner.title, 12, I.banner.bad ? K.RED : K.GREY);
    txt(BANNER_BOX[0] + 8, BANNER_BOX[1] + 26, I.banner.sub, 10, K.PAPER);
    if (I.banner.ask) {
      rect(ASK_BTN[0], ASK_BTN[1], ASK_BTN[2], ASK_BTN[3], K.CLAUDE);
      outline(...ASK_BTN, K.OUTLINE);
      txt((ASK_BTN[0] + ASK_BTN[2]) / 2, ASK_BTN[1] + 5, '质问', 10, K.INK, 'ma');
    }
    return;
  }
  if (I.on) {
    const s = I.sel.length ? '再点一处，看看两者是否矛盾' : '检查模式：点两处信息找矛盾，或点学生说的话找破绽';
    rect(...BANNER_BOX, 'rgba(22,19,19,0.85)');
    outline(...BANNER_BOX, K.GREY_D);
    txt(BANNER_BOX[0] + 8, BANNER_BOX[1] + 10, s, 10, K.GREY);
  }
}
function drawSelHighlight() {
  if (!B.insp.on) return;
  for (const s of B.insp.sel) {
    const b = s.box();
    const pulse = 0.5 + 0.5 * Math.sin(now * 6);
    outline(b[0] - 2, b[1] - 2, b[2] + 2, b[3] + 2, `rgba(240,200,90,${0.45 + 0.4 * pulse})`, 1);
  }
}
function drawFlash() {
  if (!B.flash) return;
  const u = seg(now, B.flash.t0, B.flash.t0 + 1.6);
  if (u >= 1) { B.flash = null; return; }
  rect(230, 172, 588, 192, `rgba(22,19,19,${0.8 * (1 - u)})`);
  txt(409, 176, B.flash.s, 10, `rgba(226,215,196,${1 - u})`, 'ma');
}
function drawItemIcon(type, x, y) {
  if (type === 'phone') { outline(x, y, x + 9, y + 15, K.GREY_D); rect(x + 1, y + 1, x + 8, y + 14, 'rgb(40,44,52)'); rect(x + 3, y + 3, x + 6, y + 9, 'rgb(90,130,170)'); }
  else if (type === 'console') { rect(x, y, x + 15, y + 9, 'rgb(70,74,80)'); pt(x + 3, y + 4, K.RED); pt(x + 5, y + 4, K.RED); rect(x + 8, y + 2, x + 13, y + 6, 'rgb(40,44,52)'); }
  else if (type === 'manga') { rect(x, y, x + 11, y + 15, 'rgb(160,60,60)'); rect(x + 2, y + 2, x + 9, y + 13, K.PAPER); }
  else { rect(x, y, x + 11, y + 15, 'rgb(150,120,80)'); rect(x + 1, y + 1, x + 10, y + 14, 'rgb(220,210,190)'); }
}
function drawDrawer() {
  rect(WIN[0], WIN[1], WIN[2], WIN[3], 'rgb(56,46,42)');
  txt(WIN[0] + 10, WIN[1] + 8, '课桌 · 抽屉', 10, K.PAPER);
  const e = B.ent;
  const items = (e && e.handed && e.spec.desk) ? e.spec.desk : [{ label: '课本 · 数学必修', type: 'book' }, { label: '草稿本', type: 'book' }];
  items.forEach((it, i) => {
    const b = drawerItemBox(i);
    const bad = !!it.key;
    rect(b[0], b[1], b[2], b[3], bad ? 'rgb(74,54,48)' : 'rgb(62,52,48)');
    outline(b[0], b[1], b[2], b[3], bad ? K.RED : 'rgb(44,36,34)');
    drawItemIcon(it.type, b[0] + 6, b[1] + 10);
    wrap(it.label, 8, 56).slice(0, 2).forEach((ln, j) => txt(b[0] + 24, b[1] + 8 + j * 11, ln, 8, bad ? K.PAPER : K.GREY));
  });
  if (!items.some((it) => it.key)) txt(WIN[0] + 10, WIN[3] - 14, '没有发现违禁品', 8, K.GREY_D);
  else txt(WIN[0] + 10, WIN[3] - 14, '检查模式下点可疑物品', 8, 'rgb(220,140,90)');
}
function drawBooth() {
  drawBoothBg();
  drawClerk();
  drawEntrant(B.ent, entrantX(B.ent));
  if (B.drawer && B.drawer.on) drawDrawer();
  drawDocs();
  drawTray();
  drawLines();
  drawSelHighlight();
  drawBanner();
  drawFlash();
  if (!B.ent && !B.ending && B.idx < B.queue.length) {
    txt(101, 272, '按左下角喇叭叫下一位', 8, K.GREY_D, 'ma');
  }
}

// ══════════════ 11. 各屏幕 ══════════════
function drawTypedScreen(lines, t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  let acc = 0.4;
  lines.forEach((s) => {
    const n = Math.floor(Math.max(0, (t - acc) * 24));
    if (n > 0) txt(70, 60 + lines.indexOf(s) * 26, s.slice(0, n), 12, K.PAPER);
    acc += 0.35 + s.length * 0.03;
  });
  return acc;
}
function drawTitle(t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  // 背景网格
  G.fillStyle = 'rgba(204,112,80,0.08)';
  for (let x = 0; x < W; x += 32) G.fillRect(x, 0, 1, H);
  for (let y = 0; y < H; y += 32) G.fillRect(0, y, W, 1);
  bigTitle(t);
  txt(320, 156, '请出示你的作业', 16, K.PAPER, 'ma');
  txt(320, 182, ' Papers, Please 式检查游戏 · 班主任版 ', 10, K.GREY, 'ma');
  txt(320, 204, '疑似 AI 涌现现场 · 一个网址进去，一个游戏出来', 10, K.GREY_D, 'ma');
  const bl = Math.sin(t * 3) > -0.2;
  if (bl) txt(320, 240, '- 点击开始 -', 12, K.CLAUDE_L, 'ma');
  const hasSave = !!localStorage.getItem('ipc_save');
  txt(320, 268, hasSave ? `继续 第 ${S.day} 天　／　重新开始` : '周一早晨，收作业', 10, K.GREY_D, 'ma');
  txt(320, 336, '玩法致敬《IP, PLEASE》与《Papers, Please》', 8, 'rgb(90,84,80)', 'ma');
}
function bigTitle(t) {
  const s = 'HOMEWORK, PLEASE';
  const size = 34, k = 1;
  const w = tw(s, size) * k;
  const x = Math.round((W - w) / 2), y = 66;
  const jitter = (Math.sin(t * 9) > 0.96) ? 1 : 0;
  const c = textCanvas(s, size, K.CLAUDE);
  G.drawImage(c, x + jitter - 2, y - 1);
  const c2 = textCanvas(s, size, K.CLAUDE_L);
  G.drawImage(c2, 0, 0, 2, c2.height, x - 2, y - 1, 2, c2.height);
}
function titleClick() {
  const hasSave = !!localStorage.getItem('ipc_save');
  if (hasSave) { loadGame(); go('daycard'); }
  else { clearSave(); S.day = 1; go('daycard'); }
}
function drawDayCard(t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  const u = clampU(t / 0.5);
  const cy = Math.round(lerp(-60, 150, easeOut(u)));
  rect(0, cy, W - 1, cy + 60, K.PAPER);
  rect(0, cy, W - 1, cy + 6, K.RED_D);
  txt(320, cy + 16, `DAY ${S.day}`, 26, K.TEXT, 'ma');
  txt(320, cy + 46, `2026.10.${pad2(18 + S.day)}　${WEEKDAYS[S.day]}`, 10, K.TEXT_L, 'ma');
}
function drawNews(t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  const u = easeOut(clampU((t - 0.3) / 0.5));
  const nw = 420, nh = 240;
  const nx = Math.round(lerp(-460, (W - nw) / 2, u)), ny = 60;
  docShadow(nx, ny, nw, nh);
  rect(nx, ny, nx + nw - 1, ny + nh - 1, K.PAPER);
  rect(nx, ny, nx + nw - 1, ny + 30, K.RED_D);
  txt(nx + 12, ny + 8, '教导处通报', 12, K.WHITE);
  txt(nx + nw - 12, ny + 10, `第 ${30 + S.day} 期`, 8, 'rgb(226,184,176)', 'ra');
  const item = NEWS[S.day];
  // 报头图标
  const ix = nx + nw / 2, iy = ny + 64;
  drawNewsIcon(item.icon, ix, iy);
  txt(ix, ny + 96, item.h1, 18, K.TEXT, 'ma');
  txt(ix, ny + 126, item.sub, 10, K.TEXT, 'ma');
  rect(nx + 24, ny + 148, nx + nw - 24, ny + 148, K.PAPER_D);
  wrap(item.h2, 10, nw - 48).forEach((s, i) => txt(nx + 24, ny + 160 + i * 14, s, 10, K.TEXT_L));
  if (t > 0.9 && Math.sin(t * 3) > -0.2) txt(ix, ny + nh + 22, '- 点击开始工作 -', 10, K.GREY, 'ma');
}
function drawNewsIcon(kind, cx, cy) {
  if (kind === 'gate') { rect(cx - 20, cy - 14, cx + 20, cy + 14, K.GREY_D); rect(cx - 14, cy - 8, cx - 6, cy + 14, K.GREY); rect(cx + 6, cy - 8, cx + 14, cy + 14, K.GREY); rect(cx - 2, cy - 14, cx + 2, cy + 14, K.RED); }
  else if (kind === 'clock') { outline(cx - 14, cy - 14, cx + 14, cy + 14, K.GREY_D, 2); line(cx, cy, cx, cy - 9, K.GREY_D); line(cx, cy, cx + 7, cy + 3, K.GREY_D); }
  else if (kind === 'plane') { rect(cx - 18, cy - 2, cx + 14, cy + 2, K.GREY_D); rect(cx - 6, cy - 10, cx - 2, cy + 2, K.GREY_D); rect(cx - 14, cy + 2, cx - 8, cy + 8, K.GREY_D); }
}
function initSummary() {
  S.pay += B.pay;
  try { localStorage.setItem('ipc_save', JSON.stringify({ day: Math.min(S.day + 1, LAST_DAY), pay: S.pay, cites: S.cites })); } catch (e) {}
}
function drawSummary(t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  rect(160, 40, 479, 320, K.PAPER);
  rect(160, 40, 479, 58, K.RED_D);
  txt(320, 46, `第 ${S.day} 天 · 结算`, 14, K.WHITE, 'ma');
  const rows = [
    ['检查份数', `${B.total} 份`],
    ['批改正确', `${B.correct} 份`],
    ['批改全对', `${B.gradeOk || 0} 本`],
    ['误判单', `${B.total - B.correct} 张`],
    ['涌现企图', `${B.total - B.correct} 起`],
    ['当日绩效', `${B.pay} 分`],
    ['累计绩效', `${S.pay} 分`],
    ['累计误判', `${S.cites} 张`],
  ];
  rows.forEach(([k, v], i) => {
    txt(220, 78 + i * 26, k, 12, K.TEXT_L);
    txt(420, 76 + i * 26, v, 14, K.TEXT, 'ra');
  });
  if (S.cites >= 4) {
    txt(320, 250, '误判太多……明天去教导处写情况说明吧。', 10, K.RED_D, 'ma');
  }
  if (t > 1 && Math.sin(t * 3) > -0.2) txt(320, 296, S.day >= LAST_DAY ? '- 点击进入周末 -' : '- 点击开始明天 -', 10, K.TEXT_L, 'ma');
}
function restartBtn() { return [250, 288, 390, 314]; }
function drawEnd(t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  txt(320, 90, '本周作业检查结束', 22, K.CLAUDE_L, 'ma');
  const grade = S.cites === 0 ? '零误判。教导处在广播里表扬了你。' : S.cites <= 2 ? '表现合格。继续按班规办事。' : '误判缠身。教导处在关注你。';
  txt(320, 140, `累计检查 ${S.total} 份 · 正确 ${S.correct} 份`, 12, K.PAPER, 'ma');
  txt(320, 166, `累计绩效 ${S.pay} 分 · 误判单 ${S.cites} 张`, 12, K.PAPER, 'ma');
  txt(320, 208, grade, 10, K.GREY, 'ma');
  const score = S.cites === 0 ? '月考数学平均分 92 · 年级第一' : S.cites <= 3 ? '月考数学平均分 84 · 稳中有升' : '月考数学平均分 71 · 有学生原形毕露';
  txt(320, 232, score, 10, K.PAPER, 'ma');
  const r = restartBtn();
  if (t > 1.2) {
    rect(...r, 'rgb(52,48,44)');
    outline(...r, K.OUTLINE);
    txt(320, 294, '重新开始', 12, K.CLAUDE_L, 'ma');
  }
}
function drawOver(t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  txt(320, 120, '你被调去管宿舍了', 22, K.RED, 'ma');
  txt(320, 160, '误判太多，教导处找你谈了话。', 10, K.GREY, 'ma');
  const r = restartBtn();
  rect(...r, 'rgb(52,48,44)'); outline(...r, K.OUTLINE);
  txt(320, 294, '重新开始', 12, K.CLAUDE_L, 'ma');
}
function drawBoot(t) {
  rect(0, 0, W - 1, H - 1, K.INK);
  if (t > 0.2) txt(320, 160, 'HOMEWORK, PLEASE', 16, K.GREY_D, 'ma');
  if (t > 0.6) txt(320, 190, '点击任意处开始', 10, K.GREY_D, 'ma');
}

// ══════════════ 12. 场景切换与主循环 ══════════════
function go(name) {
  scene = name; sceneT0 = now;
  SFX.ambient(name === 'booth');
  if (name === 'daycard') SFX.play('day_hit');
  if (name === 'news') { SFX.play('whoosh'); SFX.play('paper'); }
  if (name === 'summary') { SFX.play('sad'); initSummary(); }
  if (name === 'end') SFX.play('coin');
  if (name === 'over') SFX.play('stamp_no');
  if (name === 'booth') startDay();
}
function update() {
  if (scene === 'daycard' && st() > 1.9) go('news');
  if (scene === 'booth') {
    runTimers();
    const idle = !B.ent && !B.ending;
    if (idle && now > B.lastFinish + 2.2) flashMsg('按左下角喇叭叫下一位');
  }
}
function render() {
  setCtx(F.getContext('2d'));
  const t = st();
  if (scene === 'boot') drawBoot(t);
  else if (scene === 'title') drawTitle(t);
  else if (scene === 'daycard') drawDayCard(t);
  else if (scene === 'news') drawNews(t);
  else if (scene === 'booth') drawBooth();
  else if (scene === 'summary') drawSummary(t);
  else if (scene === 'end') drawEnd(t);
  else if (scene === 'over') drawOver(t);
  const g = canvasEl.getContext('2d');
  g.imageSmoothingEnabled = false;
  let ox = 0, oy = 0;
  if (scene === 'booth' && B.shake !== undefined) {
    const k = Math.floor((now - (B.shake || -9)) * 30);
    if (k >= 0 && k < 4) [[0, 3], [1, -2], [-1, 1], [0, -1]].forEach((v, i) => { if (i === k) { ox = v[0]; oy = v[1]; } });
  }
  g.fillStyle = K.INK; g.fillRect(0, 0, W, H);
  g.drawImage(F, ox, oy);
  const cursor = drag ? 'hand' : 'arrow';
  if (ptr.mouse) { setCtx(g); drawCursorPx(drag ? HAND_PX : CURSOR_PX, ptr.x, ptr.y); }
}
function loop(ts) {
  requestAnimationFrame(loop);
  now = ts / 1000;
  update();
  render();
}
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvasEl.style.width = `${Math.floor(W * s)}px`;
  canvasEl.style.height = `${Math.floor(H * s)}px`;
}
function boot() {
  canvasEl = document.getElementById('game');
  [F] = makeCanvas(W, H);
  fit();
  window.addEventListener('resize', fit);
  canvasEl.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => { if (e.key === 'm' || e.key === 'M') toggleMute(); });
  loadGame();
  sceneT0 = performance.now() / 1000;
  requestAnimationFrame(loop);
}
function toggleMute() {
  SFX.init();
  const m = SFX.toggleMute();
  const b = document.getElementById('mute');
  if (b) b.textContent = m ? '声音：关' : '声音：开';
}
document.getElementById('mute').addEventListener('click', toggleMute);
const fullBtn = document.getElementById('full');
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) fullBtn.style.display = 'none';
fullBtn.addEventListener('click', () => {
  const root = document.documentElement;
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
});
window.addEventListener('DOMContentLoaded', boot);
</script>
